name: FFmpeg compliance tests

on:
  pull_request:
    paths:
      - "third_party/ffmpeg-build/**"
      - "compliance/report/ffmpeg-self-build/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run lock and boundary tests
        shell: pwsh
        run: python -m pytest third_party/ffmpeg-build/tests -q
