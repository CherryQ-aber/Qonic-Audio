name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2

      - name: Prepare ignored test configuration
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "config.json") {
            throw "A clean checkout must not contain tracked config.json."
          }
          Copy-Item -LiteralPath "config.example.json" -Destination "config.json"

      - name: Check public repository hygiene
        shell: pwsh
        run: python scripts/check_repository_hygiene.py

      - name: Prepare pinned FFmpeg test runtime
        shell: pwsh
        run: ./scripts/prepare_ci_ffmpeg.ps1

      - name: Run complete automated regression
        shell: pwsh
        run: python -m pytest -q
